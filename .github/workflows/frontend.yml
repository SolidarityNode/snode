name: frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", "docs/schemas/openapi.json", "Makefile", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "docs/schemas/openapi.json", "Makefile", ".github/workflows/frontend.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: make setup-frontend
      - name: Generated API types match docs/schemas/openapi.json
        run: pnpm --dir frontend run gen:api && git diff --exit-code frontend/src/api/schema.d.ts
      - run: make lint-frontend
      - run: make test-frontend
      - run: pnpm --dir frontend run build
