name: core

on:
  push:
    branches: [main]
    paths: ["core/**", "Makefile", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", "Makefile", ".github/workflows/core.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.9"
          python-version: "3.12"
      - run: make setup-core
      - run: make lint-core
      - run: make test-core
