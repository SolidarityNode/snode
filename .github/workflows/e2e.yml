name: e2e

# Builds the stack with Docker (the Makefile engine variables), seeds the demo data and runs the
# Playwright end-to-end test in its official image.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - "core/**"
      - "frontend/**"
      - "data/synthetic/**"
      - "compose.yaml"
      - "Makefile"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    env:
      CONTAINER_ENGINE: docker
      COMPOSE: docker compose
      SOLIDARITYNODE_BASEMAP: blank
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: make env setup-frontend
      - run: make test-e2e
      - if: failure()
        run: $COMPOSE logs --no-color > compose-logs.txt 2>&1
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-results
          path: |
            frontend/test-results
            compose-logs.txt
