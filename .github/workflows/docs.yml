name: docs

# Documentation site (ADR 0018): strict build, link check, generated files, and publication
# to GitHub Pages with mike: `dev` from main, `X.Y` (alias `latest`) from release tags vX.Y.Z.
# One-time setup by the maintainer: docs/releasing.md, "Documentation versions".

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "VERSION"
      - "docs/**"
      - "mkdocs.yml"
      - "lychee.toml"
      - "tools/docs/**"
      - "scripts/docs_indexes.py"
      - "scripts/docs_i18n.py"
      - "scripts/deps_report.py"
      - "scripts/version.py"
      - "scripts/check_licenses.py"
      - "core/pyproject.toml"
      - "core/uv.lock"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "compose.yaml"
      - "**/Containerfile"
      - "Makefile"
      - ".github/workflows/docs.yml"
  schedule:
    - cron: "41 5 * * 1" # weekly link check against link rot

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Version, generated indexes (ADR index, specs index, OQ counts) and Greek pages are current
        run: make docs-check
      - run: make setup
      - name: Dependency report is current and every licence is allowed
        run: make deps-report-check
      - name: Build the site with --strict
        run: make docs-build
      - name: Check links in README and docs
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress README.md CHANGELOG.md CONTRIBUTING.md 'docs/**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # mike pushes the built site to the gh-pages branch
    concurrency:
      group: docs-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.12"
      - run: make docs-setup
      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true
      - name: Publish dev (main)
        if: github.ref == 'refs/heads/main'
        env:
          DOCS_GIT_REF: main
        run: |
          cd tools/docs
          uv run --frozen mike deploy -F ../../mkdocs.yml --push dev
          if ! uv run --frozen mike list -F ../../mkdocs.yml | grep -q latest; then
            uv run --frozen mike set-default -F ../../mkdocs.yml --push dev
          fi
      - name: Publish a release (X.Y, alias latest)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DOCS_GIT_REF: ${{ github.ref_name }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          minor="${tag%.*}"
          test "$tag" = "$(cat VERSION)" || { echo "tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }
          cd tools/docs
          uv run --frozen mike deploy -F ../../mkdocs.yml --push --update-aliases "$minor" latest
          uv run --frozen mike set-default -F ../../mkdocs.yml --push latest
